runtime:
  # Backend server: use 0.0.0.0 so the frontend can reach it over LAN/VPN.
  host: 0.0.0.0
  port: 8100
  request_timeout_seconds: 30

models:
  - id: mock_model
    name: Mock Test Model
    enabled: true
    mode: local_adapter
    adapter: mock
    model_dir: models/remote_endpoint_example
    endpoint: null
    options: {}

  - id: gemini_api
    name: Gemini API
    enabled: false
    mode: local_adapter
    adapter: gemini
    model_dir: models/gemini_api
    endpoint: null
    env_key: GEMINI_API_KEY
    options:
      model_name: gemini-3.1-flash-lite

  - id: qwen3_0.6B
    name: Qwen3 0.6B
    enabled: false
    mode: remote_endpoint
    adapter: remote
    model_dir: null
    endpoint: http://localhost:8103/predict
    options:
      health_endpoint: http://127.0.0.1:8103/health?load_model=true
      health_timeout_seconds: 30

  - id: sbert
    name: SBERT
    enabled: false
    mode: local_adapter
    adapter: sbert
    model_dir: models/sbert_emotion
    endpoint: null
    options:
      model_name: models/sbert_emotion/finetuned_model
      profiles_path: profiles.json
      device: cpu
      local_files_only: true

  - id: compact_llm
    name: CompactLM FP32
    enabled: false
    mode: local_adapter
    adapter: custom_pytorch
    model_dir: models/compact_llm
    checkpoint: checkpoint/sentilight_compactlm_final.pt
    tokenizer_dir: tokenizer
    endpoint: null
    options:
      device: cpu
      max_new_tokens: 96

  - id: compact_llm_q4
    name: CompactLM Q4
    enabled: false
    mode: local_adapter
    adapter: custom_pytorch
    model_dir: models/compact_llm_q4
    checkpoint: checkpoint/sentilight_compactlm_mixed4_inference.pt
    tokenizer_dir: tokenizer
    endpoint: null
    options:
      device: cpu
      max_new_tokens: 48
